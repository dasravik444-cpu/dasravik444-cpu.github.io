<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Plant Parlour</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f7f2;color:#14281a}
main{max-width:440px;margin:0 auto;padding:24px 18px 40px;text-align:center}
h1{font-size:26px;margin:6px 0 2px} .lead{color:#4b5d50;margin:0 0 18px}
.btn{display:block;padding:17px;border-radius:14px;font-size:20px;font-weight:700;text-decoration:none;margin:12px 0;
border:0;width:100%;box-sizing:border-box;cursor:pointer}
.pay{background:#1f7a3a;color:#fff} .rev{background:#fff;color:#1a73e8;border:2px solid #1a73e8}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.app{padding:11px 6px;border-radius:10px;background:#fff;border:1px solid #b9cdbb;color:#14281a;font-weight:600;
text-decoration:none;font-size:15px}
.small{font-size:13px;color:#5f6f63;margin:6px 0 14px} .upi{font-family:monospace;font-size:15px}
.copy{margin-top:6px;padding:8px 14px;border-radius:8px;border:1px solid #1f7a3a;background:#fff;color:#1f7a3a;
font-weight:600;font-size:14px} hr{border:0;border-top:1px solid #d6e2d6;margin:20px 0}
</style></head><body><main>
<div style="font-size:42px">🌿</div><h1>Plant Parlour</h1><p class="lead">Thank you for shopping with us!</p>
<a id="pay" class="btn pay" href="upi://pay?pa=das.ravik444@okhdfcbank&pn=Plant%20Parlour&cu=INR">Pay with UPI</a>
<p class="small">Choose your app, then enter the amount. Or open one directly:</p>
<div id="apps" class="apps"></div>
<p class="small">Still not opening? Copy our UPI ID and pay it in any UPI app:<br>
<span class="upi" id="upi">das.ravik444@okhdfcbank</span><br><button class="copy" id="copy" type="button">Copy UPI ID</button></p>
<hr>
<a id="rev" class="btn rev" href="https://g.page/r/Ccw_NrRl81-iECE/review" target="_blank" rel="noopener">★ Review us on Google</a>
<p class="small">Optional - you never need to review to pay. Thank you!</p>
</main>
<script>
(function () {
  var d = {"q": "pa=das.ravik444@okhdfcbank&pn=Plant%20Parlour&cu=INR", "apps": [["Google Pay", "com.google.android.apps.nbu.paisa.user", "gpay://upi/pay?"], ["PhonePe", "com.phonepe.app", "phonepe://pay?"], ["Paytm", "net.one97.paytm", "paytmmp://pay?"], ["BHIM", "in.org.npci.upiapp", "upi://pay?"]]}, ua = navigator.userAgent || "", android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  function intent(pkg) { return "intent://pay?" + d.q + "#Intent;scheme=upi;" + (pkg ? "package=" + pkg + ";" : "") + "end"; }
  if (android) document.getElementById("pay").href = intent("");      // the "Pay with..." chooser of all UPI apps
  var box = document.getElementById("apps");
  d.apps.forEach(function (a) {
    var link = document.createElement("a");
    link.className = "app"; link.textContent = a[0];
    link.href = android ? intent(a[1]) : (ios ? a[2] + d.q : "upi://pay?" + d.q);
    box.appendChild(link);
  });
  document.getElementById("copy").onclick = function () {
    var t = document.getElementById("upi").textContent, b = this;
    function done() { b.textContent = "Copied!"; }
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { prompt("Copy this UPI ID:", t); });
    else prompt("Copy this UPI ID:", t);
  };
  var rev = document.getElementById("rev");               // back from Google: pay is the next step
  try {
    if (rev) rev.addEventListener("click", function () { sessionStorage.setItem("reviewed", "1"); });
    if (sessionStorage.getItem("reviewed")) document.querySelector(".lead").textContent = "Thank you for your review! Pay below.";
  } catch (e) {}
})();
</script></body></html>
